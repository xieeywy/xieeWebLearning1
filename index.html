<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Document</title>
</head>
<body>
    <!-- header -->
     <header class="header">
        <h1>LOGIN FORM</h1>
        <p>please login to get full feature access</p>
     </header>

    <!-- main content -->
     <main>
        <section>

            <article class="login-form">

            <div class="hero">
                <h2>Login</h2>
            </div>

            <form action="yuhuweb/index.html">

                <div class="box">
                <input type="email" name="email"  placeholder="your email" required>
                </div>

                <div class="box">
                <input type="text" name="username" id="username" placeholder="username" required>
                </div>

                <div class="box">
                <input type="password" name="password" id="password" placeholder="password" required>
                </div>

                <div class="help">
                     <p>forgot your password? <a href="https://accounts.google.com/v3/signin/accountchooser?hl=en-GB&service=chromiumsync&flowName=GlifWebSignIn&flowEntry=AccountChooser&dsh=S538545796%3A1785745143769102">click here</a></p>
                     <p>or</p>
                </div>

                <div class="social-login">
                    <a href="https://www.facebook.com"><i class="fa-brands fa-square-facebook"></i></a>
                    <a href="https://www.google.com"><i class="fa-brands fa-google-plus-g"></i></a>
                    <a href="https://www.discord.com"><i class="fa-brands fa-discord"></i></a>
                </div>

                <div class="btn">
                <button type="submit">Login</button>
                </div>
                
            </form>

            </article>

        </section>
     </main>

     <!-- footer -->
      <footer class="footer">
        &copy; xieeywy 2026
      </footer>
</body>
</html>
